<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">videytube logo</title>
  <desc id="desc">
    Minimalist professional videytube logo with a geometric v and motion accent.
  </desc>

  <defs>
    <linearGradient
      id="markGradient"
      x1="18"
      y1="18"
      x2="122"
      y2="142"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#153B52" />
      <stop offset="1" stop-color="#0B2433" />
    </linearGradient>
  </defs>

  <!-- Brand mark -->
  <g transform="translate(18 18)">
    <rect
      width="144"
      height="144"
      rx="42"
      fill="url(#markGradient)"
    />

    <!-- Custom geometric v -->
    <path
      d="M35 46L61 105L87 46"
      fill="none"
      stroke="#F5FAFC"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Motion accent -->
    <path
      d="M78 46L108 75L78 104"
      fill="none"
      stroke="#45D3C2"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle
      cx="108"
      cy="75"
      r="6.5"
      fill="#45D3C2"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="196"
    y="116"
    fill="#102332"
    font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
    font-size="72"
    font-weight="650"
    letter-spacing="-3.2"
  >
    vide<tspan fill="#18B8AA">y</tspan>tube
  </text>
</svg>
